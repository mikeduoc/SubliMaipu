<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Tienda Productos</title>
    <link rel="stylesheet" href="subli_css/subli_estilo.css">
</head> 
<body>

<header>
    <div class="header-container container">
        <a href="index.html" class="logo">
            <img src="images/logo.svg" alt="Logo SubliMaipu">
        </a>
        <nav class="menu-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="subli_productos.html">Productos</a></li>
                <li><a href="subli_nosotros.html">Nosotros</a></li>
                <li><a href="subli_contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="menu-usuario">
            <a href="iniciar_sesion.html">Iniciar Sesión</a>
            <a href="registro.html">Registrar Usuario</a>
            <a href="#" class="cart-icon">🛒 Carrito (<span id="cart-count">0</span>)</a>
        </div>
        <input type="checkbox" id="menu-toggle" />
        <label for="menu-toggle" class="menu-icono">
            <img src="images/menu.png" alt="Menú">
        </label>
    </div>
</header>

<main>
    <section class="form-container">
        <img class="form-logo" src="images/logo.svg" alt="Logo SubliMaipu">
        <h2>Formulario de Contacto</h2>

    <form id="contact-form" action="https://formspree.io/f/xvgbbgnj" method="POST" novalidate>
    <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"> </div>

    <div class="form-group">
        <label for="email">Correo:</label>
        <input type="email" id="email" name="email" required>
        </div>

    <div class="form-group">
        <label for="comentario">Comentario:</label>
        <textarea id="comentario" name="comentario" rows="4" required maxlength="2000"></textarea>
        </div>

    <div class="error-message" id="contact-error"></div>

    <button type="submit" class="btn">Enviar Mensaje</button>
</form>
    </section>
</main>

<script src="subli_js/subli_animacion.js" defer></script>

</body>
</html>
